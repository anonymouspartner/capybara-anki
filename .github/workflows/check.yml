name: check

# Runs on every push and PR so a broken migration CLI or FSRS replay is caught
# before it reaches main. Every fixture is synthetic (migration/tests/fixtures.py) —
# this workflow never touches a real collection export, needs no secrets, and makes
# no network request beyond installing dependencies. Never add one.
#
# Two jobs, matching the two languages this repo actually uses (D6/D7): Python for
# the local-only migration CLI (step 0), Deno/TypeScript for everything that will
# eventually be hosted — right now that's just the FSRS replay logic (step 1). Grows
# to cover the reviewer/edge functions once those exist.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  fsrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check
        # The edge function is checked but never run here — Deno.serve() at its
        # top level would bind a port on import, which is exactly why it's outside
        # src/ and outside this job's test glob below.
        run: deno check src/fsrs/*.ts src/review/*.ts supabase/functions/sync/index.ts web/demo-server.ts

      - name: Run tests
        run: deno test --allow-read --allow-env src/

  migration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches this session's dev environment; 3.12 guards against the
        # version a CI runner or the maintainer's machine may pick.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            migration/requirements.txt
            migration/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r migration/requirements-dev.txt

      # Catches a syntax error in any file, including one no test imports.
      - name: Byte-compile every source file
        run: python -m compileall -q migration

      - name: Lint (unused imports, undefined names)
        run: python -m pyflakes migration

      - name: Run tests
        run: python -m pytest migration/tests -v
