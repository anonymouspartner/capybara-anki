<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capybara — Stats</title>
<link rel="stylesheet" href="theme.css" />
<style>
  /* Page-specific; the palette and toolbar chrome come from theme.css. */
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .stat-label { color: var(--fg-muted); font-size: 14px; }
  .stat-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

  #chart-title { font-size: 14px; color: var(--fg-muted); margin: 24px 0 8px; }
  #chart {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 140px;
    border-bottom: 1px solid var(--border);
  }
  .chart-bar {
    flex: 1;
    display: flex;
    flex-direction: column-reverse;
    min-width: 2px;
  }
  .chart-bar div { width: 100%; }
  .chart-bar .seg-again { background: var(--btn-again); }
  .chart-bar .seg-hard { background: var(--btn-hard-fg); }
  .chart-bar .seg-good { background: var(--btn-good); }
  .chart-bar .seg-easy { background: var(--btn-easy); }
  #chart-range { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg-muted); margin-top: 4px; }

  #composition { display: flex; gap: 10px; margin-top: 24px; }
  .comp-block { flex: 1; text-align: center; padding: 12px 4px; border-radius: 8px; background: var(--bg-toolbar); }
  .comp-count { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .comp-label { font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
</style>
</head>
<body>
<div id="toolbar">
  <a href="./" class="icon-btn">←</a>
  <h1>Stats</h1>
  <span style="width: 28px"></span>
</div>
<main>
  <div id="content"><div style="padding: 40px; text-align: center; color: var(--fg-muted)">Loading…</div></div>
</main>
<script type="module" src="stats.js"></script>
</body>
</html>
