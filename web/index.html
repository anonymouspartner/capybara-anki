<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capybara</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fdfdfd;
    --fg: #1b1b1b;
    --muted: #666;
    --border: #ddd;
    --accent: #3b6ea5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --fg: #eee; --muted: #999; --border: #333; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  main { width: 100%; max-width: 480px; }
  #card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 20px;
    text-align: center;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
  }
  #lemma { font-size: 28px; font-weight: 600; }
  #back { display: none; flex-direction: column; gap: 8px; }
  #back.visible { display: flex; }
  .translation { font-size: 20px; }
  .gloss { color: var(--muted); }
  .pos { font-size: 13px; color: var(--muted); font-style: italic; }
  .example { margin-top: 10px; }
  .example-translation { color: var(--muted); font-size: 15px; }
  #reveal-row, #rating-row, #tools-row { display: flex; gap: 8px; margin-top: 16px; }
  button {
    flex: 1;
    padding: 12px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: none;
    color: var(--fg);
    font-size: 15px;
    cursor: pointer;
  }
  #reveal-row button { background: var(--accent); color: white; border: none; }
  .rating-again { border-color: #c0392b; color: #c0392b; }
  .rating-hard { border-color: #d68910; color: #d68910; }
  .rating-good { border-color: #229954; color: #229954; }
  .rating-easy { border-color: #2471a3; color: #2471a3; }
  #tools-row button { font-size: 13px; color: var(--muted); flex: none; padding: 8px 12px; }
  #empty, #error { text-align: center; padding: 40px 16px; color: var(--muted); }
  #edit-form { display: none; flex-direction: column; gap: 8px; margin-top: 12px; text-align: left; }
  #edit-form.visible { display: flex; }
  #edit-form label { font-size: 12px; color: var(--muted); }
  #edit-form input {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-size: 14px;
  }
  #edit-errors { color: #c0392b; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div id="card">
    <div id="loading">Loading…</div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
