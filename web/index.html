<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capybara</title>
<link rel="stylesheet" href="theme.css" />
<style>
  /* Palette matches AnkiDroid's own night theme as closely as CSS reasonably
     allows: near-black surfaces at two elevations (toolbar/stats strip a shade
     lighter than the card body), the same new/learning/review color convention
     (blue/red/green), and the same button treatment (Again/Good/Easy solid-filled,
     Hard visually quieter). Light mode is a straight inversion for anyone who
     isn't in night mode — Anki supports both, so this does too. Color tokens and
     toolbar chrome live in theme.css, shared with scan.html. */
  #stats-strip {
    display: flex;
    gap: 16px;
    padding: 8px 16px;
    background: var(--bg-toolbar);
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  /* `hidden` has to win over the display these two set -- an id rule's display
     otherwise beats the attribute's own display:none, which left both showing as
     empty bands above the deck list (the same trap theme.css notes for
     .icon-btn). */
  #stats-strip[hidden], #notice[hidden] { display: none; }
  /* .new/.learning/.review/.pending moved to theme.css — stats.html's collection
     composition blocks need the same three colors, and the bug that made this
     class-not-container-scoped in the first place (see theme.css's own comment)
     applies just as much across pages as within one. */

  /* Deck list, grouped by person: each person's decks are the language they're
     learning, and studying only your own group is what keeps the two schedules
     apart (the collection is shared, one schedule per card). */
  .person {
    margin: 16px 0;
    padding: 16px;
    border: 2px solid var(--border);
    border-radius: 16px;
  }
  .person-head { display: flex; align-items: center; gap: 12px; }
  .avatar {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    background: var(--duo-blue);
  }
  .person.partner .avatar { background: var(--duo-orange); }
  .person-name { font-size: 18px; font-weight: 800; }
  .person-sub { font-size: 13px; color: var(--fg-muted); }
  .person-who { flex: 1; min-width: 0; }
  .streak {
    font-weight: 800;
    font-size: 17px;
    color: var(--duo-orange);
    white-space: nowrap;
  }
  .streak.cold { color: var(--fg-muted); filter: grayscale(1); }
  .goal { margin: 14px 0 4px; }
  .goal-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    color: var(--fg-muted);
    margin-bottom: 6px;
  }
  .person .btn-3d { margin-top: 14px; }
  .all-done { margin-top: 14px; text-align: center; font-weight: 700; color: var(--duo-green); }
  .partner-toggle {
    width: 100%;
    margin-top: 10px;
    background: none;
    border: none;
    color: var(--fg-muted);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    cursor: pointer;
  }
  .partner-note { font-size: 12px; color: var(--fg-muted); margin: 8px 2px 0; }
  .deck-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-bottom-width: 4px;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 80ms ease-out, border-bottom-width 80ms ease-out;
    -webkit-tap-highlight-color: transparent;
  }
  .deck-row:active { transform: translateY(2px); border-bottom-width: 2px; }
  .deck-icon { font-size: 22px; width: 28px; text-align: center; }

  /* The post-answer notice: what was just recorded, and the way back from it.
     Sits under the toolbar rather than floating over the card, because it must
     never cover the rating buttons on a short phone screen — the bar at the
     bottom is the one piece of UI that has to stay reachable at all times. */
  #notice {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--bg-toolbar);
    color: var(--fg-muted);
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  #notice .notice-text { flex: 1; min-width: 0; }

  /* Spelling cards (the Capybara+ note type's second template). */
  #spelling-answer {
    margin: 12px 0 4px;
    font-size: 30px;
    font-weight: 700;
    color: var(--btn-good);
  }
  /* The letter-count dots AnkiDroid's own type-in-the-answer widget shows
     before you type — reviewer chrome, not template content, but real: a
     screenshot of the actual app is what put this back after an earlier pass
     removed it as guessed-at UI. Its own token rather than reusing --btn-again
     — it's a typing hint, not a rating color, and reusing one would tie two
     unrelated meanings together the moment either needed to change. */
  #spelling-dots {
    margin: 18px 0 8px;
    letter-spacing: 4px;
    color: var(--type-hint);
    font-size: 20px;
  }
  #spelling-input {
    width: 100%;
    box-sizing: border-box;
    margin-top: 12px;
    padding: 10px 12px;
    font-size: 20px;
    color: var(--fg);
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--btn-good);
    border-radius: 0;
  }
  #spelling-input:focus { outline: none; }
  /* #spelling-verdict is a .verdict-banner (below); only its spacing is local. */
  #spelling-verdict { margin: 0 -4px 8px; }
  #notice.leech .notice-text { color: var(--btn-again, #c1554a); font-weight: 600; }
  #notice button {
    flex: none;
    padding: 6px 14px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--fg);
    cursor: pointer;
  }
  .deck-name { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; }
  .deck-counts { display: flex; gap: 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
  #session-footer {
    text-align: center;
    color: var(--fg-muted);
    font-size: 13px;
    padding: 20px 0;
  }
  #session-footer a { color: var(--fg-muted); text-decoration: underline; }

  /* Card */
  #card {
    padding: 32px 4px;
    text-align: center;
    min-height: 55vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #lemma { font-size: 30px; font-weight: 600; }
  #back { display: none; flex-direction: column; gap: 8px; }
  #back.visible { display: flex; }
  hr.divider { width: 100%; border: none; border-top: 1px solid var(--border); margin: 4px 0; }
  .translation { font-size: 22px; }
  .gloss { color: var(--fg-muted); }
  .pos { font-size: 13px; color: var(--fg-muted); font-style: italic; }
  .example { margin-top: 14px; }
  .example-translation { color: var(--fg-muted); font-size: 15px; }

  /* The session's progress, Duolingo-style: a thick bar across the top that
     fills as cards are answered. */
  #session-progress { margin: 14px 0 0; }

  #answer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    background: var(--bg-page);
    border-top: 2px solid var(--border);
  }
  #answer-bar > * { max-width: 480px; margin: 0 auto; }
  #rating-row { display: flex; gap: 8px; }
  #rating-row button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 8px 4px 10px;
    color: var(--btn-fg);
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 var(--press-depth) 0 rgba(0, 0, 0, 0.28);
    transition: transform 80ms ease-out, box-shadow 80ms ease-out;
    -webkit-tap-highlight-color: transparent;
  }
  #rating-row button:active { transform: translateY(var(--press-depth)); box-shadow: 0 0 0 transparent; }
  #rating-row .interval { font-size: 12px; font-weight: 600; opacity: 0.85; }
  /* Room under the card for the fixed answer bar, so nothing scrolls behind it. */
  #card { padding-bottom: 120px; }

  /* Right/wrong banner for the cards that check an answer (spelling,
     pronunciation): slides up from the bottom, green or red, like Duolingo's. */
  .verdict-banner {
    margin: 16px -4px 0;
    padding: 14px 16px;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 800;
    text-align: left;
    animation: slide-up 200ms ease-out;
  }
  .verdict-banner.right { background: color-mix(in srgb, var(--duo-green) 18%, transparent); color: var(--duo-green-shadow); }
  .verdict-banner.wrong { background: color-mix(in srgb, var(--duo-red) 16%, transparent); color: var(--duo-red); }
  .verdict-banner .sub { font-size: 14px; font-weight: 600; margin-top: 4px; color: var(--fg); }
  @keyframes slide-up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* End of a session: what you did, then back to the list. */
  #complete { text-align: center; padding: 40px 0 24px; animation: pop-in 300ms ease-out; }
  #complete .hero { font-size: 72px; line-height: 1; }
  #complete h2 { font-size: 26px; font-weight: 800; color: var(--duo-gold); margin: 16px 0 24px; }
  .tiles { display: flex; gap: 10px; margin-bottom: 20px; }
  .tile { flex: 1; border: 2px solid var(--tile); border-radius: 14px; overflow: hidden; }
  .tile .tile-label { background: var(--tile); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 0.6px; padding: 4px 0; text-transform: uppercase; }
  .tile .tile-value { font-size: 20px; font-weight: 800; padding: 10px 0; color: var(--tile); }
  .tile.cards { --tile: var(--duo-gold); }
  .tile.accuracy { --tile: var(--duo-green); }
  .tile.time { --tile: var(--duo-blue); }
  #complete .streak-line { font-size: 18px; font-weight: 800; color: var(--duo-orange); margin-bottom: 24px; }
  @keyframes pop-in { from { transform: scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .rating-again { background: var(--btn-again); }
  /* Scoped under #rating-row so it outranks that rule's white text, which
     otherwise left "Hard" unreadable on its light face in light mode. */
  #rating-row .rating-hard { background: var(--btn-hard-bg); color: var(--btn-hard-fg); }
  .rating-good { background: var(--btn-good); }
  .rating-easy { background: var(--btn-easy); }

  #tools-row { display: flex; gap: 8px; justify-content: center; margin-top: 20px; }
  #tools-row button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg-muted);
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
  }

  #edit-form { display: none; flex-direction: column; gap: 10px; text-align: left; padding-top: 8px; }
  #edit-form.visible { display: flex; }
  #edit-form label { font-size: 12px; color: var(--fg-muted); }
  #edit-form input {
    width: 100%;
    padding: 9px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-page);
    color: var(--fg);
    font-size: 14px;
  }
  #edit-errors { color: var(--btn-again); font-size: 13px; }

  #empty, #error { text-align: center; padding: 60px 16px; color: var(--fg-muted); }

  /* Pronunciation (D18) — record-and-score instead of reveal-and-rate. */
  #pronunciation-control { margin: 24px 0; }
  .mic-btn {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    font-size: 32px;
    cursor: pointer;
    background: var(--btn-good);
    color: var(--btn-fg);
  }
  .mic-btn.recording { background: var(--btn-again); }
  #pronunciation-status { color: var(--fg-muted); font-size: 13px; margin-top: 8px; }
  #pronunciation-result {
    margin: 16px 0;
    padding: 14px;
    border-radius: 8px;
    background: var(--bg-toolbar);
  }
  .bucket-label { font-size: 18px; font-weight: 700; letter-spacing: 0.04em; }
  #pronunciation-result.bucket-right .bucket-label { color: var(--stat-review); }
  #pronunciation-result.bucket-close .bucket-label { color: var(--btn-hard-fg); }
  #pronunciation-result.bucket-wrong .bucket-label { color: var(--btn-again); }
  #pronunciation-result .transcript { margin-top: 6px; font-style: italic; color: var(--fg-muted); }
  #pronunciation-error { color: var(--btn-again); font-size: 13px; margin-top: 8px; }
  #continue-btn { margin-top: 8px; }
  /* Matches the real Capybara+ Spelling template's `.label` exactly (plain
     uppercase, letter-spaced, no border) — a bordered pill was this app's
     own invention before a real AnkiDroid screenshot showed there isn't
     one. */
  .card-kind-badge {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--fg-muted);
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div id="toolbar">
  <button id="back-btn" class="icon-btn" hidden>←</button>
  <h1 id="title">Capybara</h1>
  <button id="add-link" class="icon-btn" hidden>➕</button>
  <a id="scan-link" class="icon-btn" href="./scan.html" hidden>📷</a>
  <button id="settings-link" class="icon-btn" hidden>⚙️</button>
</div>
<div id="stats-strip" hidden></div>
<div id="notice" hidden></div>
<main id="content"><div id="loading" style="padding: 40px; text-align: center; color: var(--fg-muted)">Loading…</div></main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
